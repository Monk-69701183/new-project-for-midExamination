<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Game Finder - Favorite Games"
    >

    <title>Favorites | Game Finder</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >


    <!-- Custom CSS -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- NAVBAR -->

    <div id="navbar"></div>


    <main>

        <!-- HEADER -->

        <section class="page-header">

            <div class="container">

                <p class="section-label">
                    MY COLLECTION
                </p>

                <h1 class="section-title">
                    Favorite Games
                </h1>

                <p class="hero-description">
                    เกมที่คุณบันทึกไว้
                    สามารถกลับมาดูได้ที่นี่
                </p>

            </div>

        </section>



        <!-- FAVORITES -->

        <section class="section-padding pt-0">

            <div class="container">


                <!-- COUNT -->

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <h2 class="h5 mb-0">
                        My Favorites
                    </h2>


                    <span
                        id="favoriteCount"
                        class="text-secondary"
                    >
                        0 games
                    </span>

                </div>



                <!-- FAVORITE GAMES -->

                <div
                    id="favoritesContainer"
                    class="row g-4"
                ></div>



                <!-- EMPTY -->

                <div
                    id="emptyFavorites"
                    class="text-center py-5 d-none"
                >

                    <i class="bi bi-heart display-4"></i>

                    <h3 class="mt-3">
                        No Favorite Games Yet
                    </h3>

                    <p class="text-secondary">
                        ไปเลือกเกมที่ชอบแล้วกด ❤️
                        เพื่อบันทึกไว้ที่นี่
                    </p>


                    <button
                        type="button"
                        class="btn btn-primary-custom mt-3"
                        onclick="goToPage('games.html')"
                    >

                        <i class="bi bi-controller"></i>

                        Browse Games

                    </button>

                </div>

            </div>

        </section>

    </main>



    <!-- FOOTER -->

    <footer class="site-footer">

        <div class="container text-center">

            <div class="footer-logo">
                🎮 GAME FINDER
            </div>

            <p>
                Find your next game. Have fun.
            </p>

            <small>
                © 2026 Game Finder
            </small>

        </div>

    </footer>



    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- Project JS -->

    <script src="js/navbar.js"></script>

    <script src="js/games.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
