<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Game Finder - Browse Games"
    >

    <title>Games | Game Finder</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >


    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- NAVBAR -->

    <div id="navbar"></div>


    <main>

        <!-- PAGE HEADER -->

        <section class="page-header">

            <div class="container">

                <p class="section-label">
                    DISCOVER
                </p>

                <h1 class="section-title">
                    Browse Games
                </h1>

                <p class="hero-description">
                    ค้นหาเกมที่คุณสนใจ
                    และเลือกเกมที่เหมาะกับสไตล์การเล่นของคุณ
                </p>

            </div>

        </section>



        <!-- FILTER -->

        <section class="section-padding pt-0">

            <div class="container">

                <div class="filter-box">

                    <div class="row g-3">


                        <!-- SEARCH -->

                        <div class="col-lg-4">

                            <label
                                for="gameSearch"
                                class="form-label"
                            >
                                Search
                            </label>


                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-search"></i>

                                </span>


                                <input
                                    type="text"
                                    id="gameSearch"
                                    class="form-control"
                                    placeholder="Search game..."
                                    oninput="filterGames()"
                                >

                            </div>

                        </div>



                        <!-- GENRE -->

                        <div class="col-md-4 col-lg-2">

                            <label
                                for="genreFilter"
                                class="form-label"
                            >
                                Genre
                            </label>

                            <select
                                id="genreFilter"
                                class="form-select"
                                onchange="filterGames()"
                            >
                                <option value="">All Genres</option>
                                <option value="Action RPG">Action RPG</option>
                                <option value="Looter Shooter">Looter Shooter</option>
                                <option value="RPG">RPG</option>
                                <option value="Simulation">Simulation</option>
                                <option value="Roguelike">Roguelike</option>
                                <option value="Shooter">Shooter</option>
                                <option value="Survival">Survival</option>
                                <option value="Metroidvania">Metroidvania</option>
                                <option value="Co-op Shooter">Co-op Shooter</option>
                                <option value="Sandbox">Sandbox</option>
                            </select>

                        </div>



                        <!-- MODE -->

                        <div class="col-md-4 col-lg-2">

                            <label
                                for="modeFilter"
                                class="form-label"
                            >
                                Mode
                            </label>

                            <select
                                id="modeFilter"
                                class="form-select"
                                onchange="filterGames()"
                            >
                                <option value="">All Modes</option>
                                <option value="Single Player">Single Player</option>
                                <option value="Multiplayer">Multiplayer</option>
                            </select>

                        </div>



                        <!-- TIME -->

                        <div class="col-md-4 col-lg-2">

                            <label
                                for="timeFilter"
                                class="form-label"
                            >
                                Play Time
                            </label>

                            <select
                                id="timeFilter"
                                class="form-select"
                                onchange="filterGames()"
                            >
                                <option value="">All Play Times</option>
                                <option value="Short">Short</option>
                                <option value="Medium">Medium</option>
                                <option value="Long">Long</option>
                            </select>

                        </div>



                        <!-- RESET -->

                        <div class="col-md-12 col-lg-2 d-flex align-items-end">

                            <button
                                type="button"
                                id="resetFilters"
                                class="btn btn-outline-light w-100"
                                onclick="resetFilters()"
                            >

                                <i class="bi bi-arrow-counterclockwise"></i>

                                Reset

                            </button>

                        </div>

                    </div>

                </div>



                <!-- RESULT HEADER -->

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <h2 class="h5 mb-0">
                        Available Games
                    </h2>

                    <span
                        id="gameCount"
                        class="text-secondary"
                    >
                        0 games
                    </span>

                </div>



                <!-- GAMES List -->

                <!-- ไม่มีมี view detail -->
                <!--<div
                    id="gamesContainer"
                    class="row g-4"
                ></div>-->

                <!-- มี view detail -->
                <div
                    id="gameList"
                    class="row g-4"
                ></div>



                <!-- NO RESULTS -->

                <div
                    id="noResults"
                    class="text-center py-5 d-none"
                >

                    <i class="bi bi-controller display-4"></i>

                    <h3 class="mt-3">
                        No Games Found
                    </h3>

                    <p class="text-secondary">
                        ลองเปลี่ยนคำค้นหาหรือตัวกรอง
                    </p>

                </div>

            </div>

        </section>

    </main>

    <!-- =====================================
         GAME LOADING / PROGRESS
    ====================================== -->

    <div
        id="gameLoading"
        class="game-loading d-none"
    >

        <div class="game-loading-box">


            <i class="bi bi-controller"></i>


            <h3>
                Loading Game...
            </h3>


            <p>
                Preparing game information
            </p>


            <!-- Progress -->

            <div class="progress">

                <div
                    id="gameProgressBar"
                    class="progress-bar"
                    role="progressbar"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="0"
                    style="width: 0%"
                ></div>

            </div>


            <small
                id="gameProgressText"
                class="game-progress-text"
            >
                0%
            </small>


        </div>

    </div>

    <!-- =====================================
         GAME MODAL
    ====================================== -->

    <div
        class="modal fade"
        id="gameModal"
        tabindex="-1"
        aria-labelledby="gameModalLabel"
        aria-hidden="true"
    >


        <div
            class="modal-dialog modal-lg modal-dialog-centered"
        >


            <div class="modal-content game-modal-content">


                <!-- =================================
                     MODAL HEADER
                ================================== -->

                <div class="modal-header">

                    <div>

                        <p class="section-label mb-1">
                            GAME DETAILS
                        </p>


                        <h5
                            class="modal-title"
                            id="gameModalLabel"
                        >
                            Game Information
                        </h5>

                    </div>


                    <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                    ></button>

                </div>



                <!-- =================================
                     MODAL BODY
                ================================== -->

                <div class="modal-body">


                    <div class="row g-4">


                        <!-- =========================
                             IMAGE
                        ========================== -->

                        <div class="col-md-5">

                            <div class="modal-image-wrapper">

                                <img
                                    id="modalGameImage"
                                    src=""
                                    alt=""
                                    class="modal-game-image"
                                >


                                <div
                                    class="modal-rating-badge"
                                >

                                    <i class="bi bi-star-fill"></i>

                                    <span
                                        id="modalGameRating"
                                    >
                                        -
                                    </span>

                                </div>

                            </div>

                        </div>



                        <!-- =========================
                             GAME INFORMATION
                        ========================== -->

                        <div class="col-md-7">


                            <!-- Genre -->

                            <span
                                id="modalGameGenre"
                                class="game-genre"
                            >
                            </span>


                            <!-- Title -->

                            <h2
                                id="modalGameTitle"
                                class="modal-game-title"
                            >
                            </h2>


                            <!-- Description -->

                            <p
                                id="modalGameDescription"
                                class="modal-game-description"
                            >
                            </p>



                            <!-- Information -->

                            <div
                                class="modal-game-info"
                            >


                                <!-- Rating -->

                                <div>

                                    <i class="bi bi-star-fill"></i>

                                    <span>
                                        Rating
                                    </span>

                                    <strong
                                        id="modalGameRatingInfo"
                                    >
                                        -
                                    </strong>

                                </div>



                                <!-- Mode -->

                                <div>

                                    <i class="bi bi-people"></i>

                                    <span>
                                        Mode
                                    </span>

                                    <strong
                                        id="modalGameMode"
                                    >
                                        -
                                    </strong>

                                </div>



                                <!-- Play Time -->

                                <div>

                                    <i class="bi bi-clock"></i>

                                    <span>
                                        Play Time
                                    </span>

                                    <strong
                                        id="modalGameTime"
                                    >
                                        -
                                    </strong>

                                </div>



                                <!-- Platform -->

                                <div>

                                    <i class="bi bi-pc-display"></i>

                                    <span>
                                        Platform
                                    </span>

                                    <strong
                                        id="modalGamePlatform"
                                    >
                                        -
                                    </strong>

                                </div>


                            </div>


                        </div>


                    </div>


                </div>



                <!-- =================================
                     MODAL FOOTER
                ================================== -->

                <div class="modal-footer">


                    <!--<button
                        type="button"
                        id="modalFavoriteButton"
                        class="btn"
                        onclick="toggleModalFavorite()"
                    >
                        <i class="bi bi-heart"></i>
                        Add to Favorites
                    </button>-->


                    <button
                        type="button"
                        class="btn btn-outline-custom"
                        data-bs-dismiss="modal"
                    >

                        <i class="bi bi-x-lg"></i>

                        Close

                    </button>


                </div>


            </div>

        </div>

    </div>



    <!-- FOOTER -->

    <div id="footer-container"></div>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- Project JS -->

    <script src="js/navbar.js"></script>

    <script src="js/games.js"></script>

    <script src="js/app.js"></script>

    <!-- =====================================
         GAMES PAGE EXTRA JAVASCRIPT
    ====================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                updateGameCount();

            }
        );



        /* =====================================
           UPDATE GAME COUNT
        ====================================== */

        function updateGameCount() {

            const gameList =
                document.getElementById(
                    "gameList"
                );

            const gameCount =
                document.getElementById(
                    "gameCount"
                );

            const filterStatus =
                document.getElementById(
                    "filterStatus"
                );


            if (!gameList || !gameCount) {
                return;
            }


            const cards =
                gameList.querySelectorAll(
                    ".game-card"
                );


            const count =
                cards.length;


            gameCount.textContent =
                count + " Game" +
                (count !== 1 ? "s" : "");


            if (filterStatus) {

                const statusText =
                    filterStatus.querySelector(
                        "div span"
                    );


                if (statusText) {

                    statusText.textContent =
                        count === games.length
                            ? "Showing all games"
                            : "Showing filtered games";

                }

            }

        }



        /* =====================================
           WATCH GAME LIST CHANGES
        ====================================== */

        const gameListElement =
            document.getElementById(
                "gameList"
            );


        if (gameListElement) {

            const observer =
                new MutationObserver(
                    function () {

                        updateGameCount();

                    }
                );


            observer.observe(
                gameListElement,
                {
                    childList: true
                }
            );

        }



        /* =====================================
           KEYBOARD ACCESSIBILITY
        ====================================== */

        document.addEventListener(
            "keydown",
            function (event) {

                const target =
                    event.target;


                if (
                    target &&
                    target.classList &&
                    target.classList.contains(
                        "game-card"
                    )
                ) {

                    if (
                        event.key === "Enter" ||
                        event.key === " "
                    ) {

                        event.preventDefault();

                        const onclick =
                            target.getAttribute(
                                "onclick"
                            );


                        if (onclick) {

                            eval(onclick);

                        }

                    }

                }

            }
        );

    </script>

</body>

</html>
