<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Game Finder - Find your next game"
    >

    <title>Find My Game | Game Finder</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >


    <!-- Custom CSS -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- NAVBAR -->

    <div id="navbar"></div>


    <main>

        <!-- HEADER -->

        <section class="page-header">

            <div class="container text-center">

                <p class="section-label">
                    GAME FINDER
                </p>

                <h1 class="section-title">
                    Find My Game
                </h1>

                <p class="hero-description mx-auto">
                    ตอบคำถามง่าย ๆ
                    แล้วค้นหาเกมที่เหมาะกับคุณ
                </p>

            </div>

        </section>



        <!-- FINDER -->

        <section class="section-padding pt-0">

            <div class="container">

                <div class="row justify-content-center">

                    <div class="col-lg-8">

                        <div class="finder-card">


                            <!-- QUESTION 1 -->

                            <div class="finder-question">

                                <label
                                    for="modeSelect"
                                    class="finder-label"
                                >

                                    <span>01</span>

                                    คุณอยากเล่นแบบไหน?

                                </label>


                                <select
                                    id="modeSelect"
                                    class="form-select form-select-lg"
                                >

                                    <option value="all">
                                        เลือกได้ทุกแบบ
                                    </option>

                                    <option value="Single Player">
                                        เล่นคนเดียว
                                    </option>

                                    <option value="Multiplayer">
                                        เล่นกับเพื่อน
                                    </option>

                                </select>

                            </div>



                            <!-- QUESTION 2 -->

                            <div class="finder-question">

                                <label
                                    for="genreSelect"
                                    class="finder-label"
                                >

                                    <span>02</span>

                                    คุณชอบเกมแนวไหน?

                                </label>


                                <select
                                    id="genreSelect"
                                    class="form-select form-select-lg"
                                >

                                    <option value="all">
                                        ยังไม่แน่ใจ
                                    </option>

                                    <option value="Action RPG">
                                        Action RPG
                                    </option>

                                    <option value="Looter Shooter">
                                        Looter Shooter
                                    </option>

                                    <option value="Simulation">
                                        Simulation
                                    </option>

                                    <option value="Roguelike">
                                        Roguelike
                                    </option>

                                    <option value="Shooter">
                                        Shooter
                                    </option>

                                </select>

                            </div>



                            <!-- QUESTION 3 -->

                            <div class="finder-question">

                                <label
                                    for="timeSelect"
                                    class="finder-label"
                                >

                                    <span>03</span>

                                    คุณมีเวลาเล่นประมาณเท่าไร?

                                </label>


                                <select
                                    id="timeSelect"
                                    class="form-select form-select-lg"
                                >

                                    <option value="all">
                                        แล้วแต่วัน
                                    </option>

                                    <option value="Short">
                                        มีเวลาน้อย
                                    </option>

                                    <option value="Medium">
                                        มีเวลาปานกลาง
                                    </option>

                                    <option value="Long">
                                        มีเวลาเยอะ
                                    </option>

                                </select>

                            </div>



                            <!-- BUTTON -->

                            <button
                                type="button"
                                id="findGameButton"
                                class="btn btn-primary-custom btn-lg w-100 mt-3"
                            >

                                <i class="bi bi-search"></i>

                                Find My Game

                            </button>

                        </div>

                    </div>

                </div>



                <!-- RESULTS -->

                <div
                    id="finderResults"
                    class="row g-4 mt-4"
                ></div>



                <!-- MESSAGE -->

                <div
                    id="finderMessage"
                    class="text-center py-5"
                >

                    <i class="bi bi-controller display-4"></i>

                    <h3 class="mt-3">
                        Ready to Find Your Next Game?
                    </h3>

                    <p class="text-secondary">
                        เลือกคำตอบด้านบนแล้วกด Find My Game
                    </p>

                </div>

            </div>

        </section>

    </main>



    <!-- FOOTER -->

    <footer class="site-footer">

        <div class="container text-center">

            <div class="footer-logo">
                🎮 GAME FINDER
            </div>

            <p>
                Find your next game. Have fun.
            </p>

            <small>
                © 2026 Game Finder
            </small>

        </div>

    </footer>



    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- Project JS -->

    <script src="js/navbar.js"></script>

    <script src="js/games.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
